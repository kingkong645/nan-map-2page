<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> แผนที่ธรณีวิทยา 3 มิติ จังหวัดน่าน </title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
}
/* แถบเมนู */
.menu {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 50px;
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    z-index: 1000;
}
/* ปุ่ม */
.menu button {
    padding: 8px 25px;
    border: 1px solid #777;
    background: #444;
    color: white;
    cursor: pointer;
    border-radius: 4px;
    font-size: 14px;
}
.menu button:hover {
    background: #666;
}
/* แผนที่ */
.map {
    position: absolute;
    top: 50px;
    left: 0;
    width: 100%;
    height: calc(100vh - 50px);
    border: none;
    display: none;
}
/* แผนที่ที่กำลังแสดง */
.map.active {
    display: block;
}
</style>
</head>
<body>
<!-- เมนู -->
<div class="menu">
    <button onclick="showMap('page1')">
        แผนที่หน้าที่ 1
    </button>
    <button onclick="showMap('page2')">
        แผนที่หน้าที่ 2
    </button>
</div>
<!-- =========================
     PAGE 1
     ========================= -->
<iframe
    id="page1"
    class="map active"
    src="Page1/index.html">
</iframe>
<!-- =========================
     PAGE 2
     ========================= -->
<iframe
    id="page2"
    class="map"
    src="Page2/index.html">
</iframe>
<script>
function showMap(mapName) {
    document.querySelectorAll('.map').forEach(function(map) {
        map.classList.remove('active');
    });
    document.getElementById(mapName).classList.add('active');
}
</script>
</body>
</html>
